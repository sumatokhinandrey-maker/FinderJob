name: Дайджест вакансий

on:
  schedule:
    - cron: "0 5 * * *"    # 08:00 МСК — резервная подготовка
    - cron: "0 6 * * *"    # 09:00 МСК — резервная отправка
    - cron: "37 7 * * *"   # 10:37 МСК — догоняющая отправка
    - cron: "37 9 * * *"   # 12:37 МСК
    - cron: "37 13 * * *"  # 16:37 МСК
  workflow_dispatch:
    inputs:
      mode:
        description: "Подготовить или отправить сегодняшний запас"
        type: choice
        options: [send, prepare]
        default: send
      probe:
        description: "Только проверить источники с раннера и выйти"
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить источники с раннера
        if: inputs.probe
        run: python3 -u probe_sources.py
      - name: Подготовить или отправить дайджест
        if: ${{ !inputs.probe }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$MODE" = "prepare" ] || [ "$SCHEDULE" = "0 5 * * *" ]; then
            python3 -u main.py --prepare
          else
            python3 -u main.py --send-prepared
          fi
