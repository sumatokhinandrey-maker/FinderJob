name: Дайджест вакансий

on:
  schedule:
    # 07:00 по Москве (GitHub считает время в UTC).
    # Расписание может съезжать на несколько минут — это нормально.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

# Нужно, чтобы job мог закоммитить обновлённый seen.json обратно в репозиторий.
permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать и отправить дайджест
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 main.py

      - name: Запомнить показанные вакансии
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name "jobresearch-bot"
            git config user.email "bot@users.noreply.github.com"
            git add seen.json
            git commit -m "seen: дайджест за $(date +%F)"
            git push
          else
            echo "Новых вакансий нет, seen.json не изменился"
          fi
