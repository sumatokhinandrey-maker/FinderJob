name: Дайджест вакансий

on:
  schedule:
    # Основной запуск: 09:00 по Москве (GitHub считает время в UTC).
    - cron: "0 6 * * *"
    # Догоняющие. Расписание в GitHub — обещание, а не гарантия: запуск
    # могут задержать на часы или пропустить совсем, и 27.08.2026 так
    # и вышло — дайджест не пришёл никому. Поэтому будим ещё несколько раз
    # за день; ключ --once-a-day гасит лишние, если рассылка уже ушла.
    # Минуты нарочно некруглые: ровный верх часа у GitHub загружен сильнее.
    - cron: "37 7 * * *"   # 10:37 МСК
    - cron: "37 9 * * *"   # 12:37 МСК
    - cron: "37 13 * * *"  # 16:37 МСК
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать и разослать дайджест
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          # Запуск руками — всегда рассылка. По расписанию — только если
          # сегодняшней ещё не было.
          ONCE: ${{ github.event_name == 'schedule' && '--once-a-day' || '' }}
        run: python3 main.py $ONCE
