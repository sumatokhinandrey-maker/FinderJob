name: Дайджест вакансий

on:
  schedule:
    # Основной запуск: 09:00 по Москве (GitHub считает время в UTC).
    - cron: "0 6 * * *"
    # Догоняющие. Расписание в GitHub — обещание, а не гарантия: запуск
    # могут задержать на часы или пропустить совсем, и 27.08.2026 так
    # и вышло — дайджест не пришёл никому. Поэтому будим ещё несколько раз
    # за день; ключ --once-a-day гасит лишние, если рассылка уже ушла.
    # Минуты нарочно некруглые: ровный верх часа у GitHub загружен сильнее.
    - cron: "37 7 * * *"   # 10:37 МСК
    - cron: "37 9 * * *"   # 12:37 МСК
    - cron: "37 13 * * *"  # 16:37 МСК
  workflow_dispatch:
    inputs:
      force:
        description: "Разослать, даже если сегодняшний дайджест уже ушёл"
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # Без потолка GitHub даёт джобу шесть часов: 15.10.2026 обход hirehi
    # разбух и запуск висел больше двух часов, а догоняющие тем временем
    # начинали такой же обход заново. Лучше упасть красным через час
    # и дать догоняющему чистую попытку.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать и разослать дайджест
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          # Защита от повторной рассылки включена всегда, кроме случая,
          # когда её сняли галочкой force при ручном запуске.
          #
          # Раньше здесь стояло условие «только для schedule», и это была
          # дыра: будильник снаружи (QStash) дёргает workflow_dispatch,
          # то есть оба его запуска — утренний и полуденный — слали бы
          # дайджест, и человек получал бы его дважды.
          ONCE: ${{ inputs.force && '' || '--once-a-day' }}
        run: python3 main.py $ONCE
